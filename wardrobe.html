<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Closet Gallery</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container">
        <div class="hero">
            <h1>Your Closet Collection</h1>
            <p>Browse through your saved clothing catalog.</p>
        </div>

        <div class="product-container" id="closetGrid"></div>
    </div>

    <script src="/js/navbar.js"></script>
    <script>
        async function loadCloset() {
            const grid = document.getElementById('closetGrid');
            grid.innerHTML = "<p style='color: #a493b8;'>Loading items...</p>";
            try {
                const res = await fetch('/api/apparel');
                if (res.ok) {
                    const items = await res.json();
                    if (items.length === 0) {
                        grid.innerHTML = "<p style='color: #ff007f;'>No garments found. Head to Upload page to add items.</p>";
                        return;
                    }
                    grid.innerHTML = items.map(item => `
                        <div class="product-card">
                            <img src="${item.image}" alt="${item.title}">
                            <h3 style="margin-top: 10px; color:#fff;">${item.title}</h3>
                            <p style="color: #ff007f; font-size: 0.85rem;">${item.category}</p>
                            <p style="color: #a493b8; font-size: 0.8rem; margin-top: 5px;">${item.tags}</p>
                        </div>
                    `).join('');
                }
            } catch (err) {
                grid.innerHTML = "<p style='color: #ff007f;'>Error loading wardrobe items.</p>";
            }
        }
        document.addEventListener("DOMContentLoaded", loadCloset);
    </script>
</body>
</html>
