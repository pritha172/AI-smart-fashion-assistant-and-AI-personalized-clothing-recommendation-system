<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Wardrobe Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="nav-logo" style="margin-bottom: 20px;">Wardrobe AI</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" style="width: 100%;">Sign In</button>
            </form>
            <p id="authFeedback" style="margin-top: 15px; color: #ff007f; font-size: 0.9rem;"></p>
            <p style="margin-top: 20px; font-size: 0.85rem; color: #a493b8;">
                Don't have an account? <a href="register.html" style="color: #ff007f;">Create one here</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const feedback = document.getElementById('authFeedback');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('userToken', data.token);
                    window.location.href = 'wardrobe.html';
                } else {
                    feedback.textContent = "Invalid login credentials.";
                }
            } catch (err) {
                feedback.textContent = "Server connection error.";
            }
        });
    </script>
</body>
</html>
