<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Garment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container">
        <div class="hero">
            <h1>Upload Item</h1>
            <p>Manually log new apparel pieces into your digital wardrobe collection.</p>
        </div>

        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <form id="uploadForm">
                <label style="display:block; margin-bottom: 5px; color: #bfaecf;">Garment Title</label>
                <input type="text" id="title" placeholder="e.g. Black Leather Jacket" required>
                
                <label style="display:block; margin-bottom: 5px; color: #bfaecf;">Category</label>
                <select id="category" style="width:100%;">
                    <option value="Top">Top / Shirt</option>
                    <option value="Bottom">Bottom / Pants</option>
                    <option value="Outerwear">Outerwear</option>
                    <option value="Footwear">Footwear</option>
                </select>

                <label style="display:block; margin-bottom: 5px; color: #bfaecf;">Tags</label>
                <input type="text" id="tags" placeholder="e.g. Casual, Winter, Black">
                
                <label style="display:block; margin-bottom: 5px; color: #bfaecf;">Garment Image</label>
                <input type="file" id="imageFile" accept="image/*" required>
                
                <button type="submit" style="width: 100%; margin-top: 10px;">Save to Closet</button>
            </form>
            <div id="uploadFeedback" style="margin-top: 15px; text-align:center;"></div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const tags = document.getElementById('tags').value;
            const file = document.getElementById('imageFile').files[0];
            const feedback = document.getElementById('uploadFeedback');
            
            if (!file) return;
            
            const reader = new FileReader();
            reader.onloadend = async function() {
                try {
                    const res = await fetch('/api/apparel/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, category, tags, image: reader.result })
                    });
                    if (res.ok) {
                        feedback.innerHTML = '<span style="color: #00ffcc;">Item cataloged successfully!</span>';
                        document.getElementById('uploadForm').reset();
                    } else {
                        feedback.textContent = "Failed to save item.";
                    }
                } catch (err) {
                    feedback.textContent = "Error connecting to server.";
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
