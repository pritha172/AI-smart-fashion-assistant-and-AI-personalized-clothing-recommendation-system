<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Style Board & Daily Look Planner - Wardrobe AI</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .planner-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .outfit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .outfit-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .item-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
        }
        .item-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255, 0, 127, 0.2);
            color: #ff007f;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="hero">
            <h1>Style Board & Daily Planner</h1>
            <p>Smart weather-aware outfit recommendations based on your closet and color harmony rules.</p>
        </div>

        <!-- Planner Controls -->
        <div class="planner-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h3 style="color: #00ffcc;">Daily Outfit Planner Engine</h3>
                    <p style="color: #a493b8; font-size: 0.9rem;">Evaluates current weather & matches tops and bottoms based on color compatibility.</p>
                </div>
                <button id="generateOutfitBtn" style="padding: 12px 24px; font-size: 1rem;">Generate Today's Look</button>
            </div>
            
            <div id="plannerStatus" style="margin-top: 15px; font-size: 0.95rem;"></div>
            <div id="outfitContainer" class="outfit-grid"></div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script>
        document.getElementById('generateOutfitBtn').addEventListener('click', generateDailyOutfits);

        async function generateDailyOutfits() {
            const statusDiv = document.getElementById('plannerStatus');
            const outfitContainer = document.getElementById('outfitContainer');

            statusDiv.innerHTML = "<span style='color:#a493b8;'>Evaluating wardrobe items...</span>";
            outfitContainer.innerHTML = "";

            try {
                let lat = 18.5204, lon = 73.8567;
                
                if (navigator.geolocation) {
                    try {
                        const position = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                        });
                        lat = position.coords.latitude;
                        lon = position.coords.longitude;
                    } catch (e) {
                        // Fallback coordinates
                    }
                }

                const res = await fetch(`/api/planner/recommend?lat=${lat}&lon=${lon}`);
                const data = await res.json();

                if (!data.recommendations || data.recommendations.length === 0) {
                    statusDiv.innerHTML = "<span style='color:#ff0055;'>Not enough matching items found. Make sure you have uploaded both Tops and Bottoms with tags!</span>";
                    return;
                }

                // Clear status message once recommendations arrive
                statusDiv.innerHTML = "";

                data.recommendations.forEach((rec, idx) => {
                    const card = document.createElement('div');
                    card.className = 'outfit-card';

                    let content = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h4 style="color: #00ffcc;">Option #${idx + 1}</h4>
                            <span class="badge">${rec.score > 1 ? 'High Color Match' : 'Neutral Match'}</span>
                        </div>
                        
                        <div class="item-preview">
                            <img src="${rec.top.image || 'https://via.placeholder.com/50'}" alt="${rec.top.title}">
                            <div>
                                <small style="color: #a493b8;">TOP</small>
                                <div style="font-weight: 600;">${rec.top.title}</div>
                            </div>
                        </div>

                        <div class="item-preview">
                            <img src="${rec.bottom.image || 'https://via.placeholder.com/50'}" alt="${rec.bottom.title}">
                            <div>
                                <small style="color: #a493b8;">BOTTOM</small>
                                <div style="font-weight: 600;">${rec.bottom.title}</div>
                            </div>
                        </div>
                    `;

                    if (rec.outerwear) {
                        content += `
                            <div class="item-preview">
                                <img src="${rec.outerwear.image || 'https://via.placeholder.com/50'}" alt="${rec.outerwear.title}">
                                <div>
                                    <small style="color: #a493b8;">OUTERWEAR</small>
                                    <div style="font-weight: 600;">${rec.outerwear.title}</div>
                                </div>
                            </div>
                        `;
                    }

                    card.innerHTML = content;
                    outfitContainer.appendChild(card);
                });

            } catch (err) {
                console.error("Planner generation error:", err);
                statusDiv.innerHTML = "<span style='color:#ff0055;'>Error contacting the recommendation engine.</span>";
            }
        }
    </script>
</body>
</html>
