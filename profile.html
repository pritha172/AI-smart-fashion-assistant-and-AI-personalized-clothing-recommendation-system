<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Wardrobe Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="hero">
            <h1 id="welcomeUser">User Profile</h1>
            <p>Account details and wardrobe collection insights.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
            <!-- Account Info Card -->
            <div class="card">
                <h3 style="margin-bottom: 15px; color: #00ffcc;">Account Info</h3>
                <div style="margin-bottom: 15px;">
                    <label style="color: #a493b8; font-size: 0.85rem;">Username</label>
                    <p id="profileUsername" style="font-size: 1.1rem; font-weight: 600;">-</p>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="color: #a493b8; font-size: 0.85rem;">Email Address</label>
                    <p id="profileEmail" style="font-size: 1rem; color: #bfaecf;">-</p>
                </div>
                <button id="logoutBtn" style="width: 100%; background: linear-gradient(45deg, #ff0055, #b90039);">Sign Out</button>
            </div>

            <!-- Stats & Analytics Card -->
            <div class="card">
                <h3 style="margin-bottom: 15px; color: #00ffcc;">Closet Analytics</h3>
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                    <div style="background: rgba(255,0,127,0.1); border: 1px solid rgba(255,0,127,0.3); padding: 20px; border-radius: 12px; text-align: center; min-width: 120px;">
                        <h2 id="totalItemsCount" style="color: #ff007f; font-size: 2.2rem;">0</h2>
                        <p style="font-size: 0.8rem; color: #a493b8;">Total Garments</p>
                    </div>
                    <div id="categoryBreakdown" style="flex-grow: 1;">
                        <p style="color: #a493b8;">Loading catalog breakdown...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script>
        async function loadProfile() {
            const token = localStorage.getItem('userToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('welcomeUser').textContent = `Welcome, ${data.username}`;
                    document.getElementById('profileUsername').textContent = data.username;
                    document.getElementById('profileEmail').textContent = data.email;
                    document.getElementById('totalItemsCount').textContent = data.stats.total_items;

                    const catMap = data.stats.categories;
                    const catKeys = Object.keys(catMap);
                    
                    if (catKeys.length === 0) {
                        document.getElementById('categoryBreakdown').innerHTML = "<p style='color:#a493b8;'>No categories logged yet.</p>";
                    } else {
                        document.getElementById('categoryBreakdown').innerHTML = `
                            <h4 style="margin-bottom: 8px; color: #bfaecf;">Category Breakdown:</h4>
                            <ul style="list-style: none; color: #a493b8; font-size: 0.9rem;">
                                ${catKeys.map(k => `<li style="margin-bottom: 4px;"><strong style="color:#fff;">${k}:</strong> ${catMap[k]} items</li>`).join('')}
                            </ul>
                        `;
                    }
                } else {
                    localStorage.removeItem('userToken');
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error("Profile fetch error:", err);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('userToken');
            window.location.href = 'login.html';
        });

        document.addEventListener("DOMContentLoaded", loadProfile);
    </script>
</body>
</html>
