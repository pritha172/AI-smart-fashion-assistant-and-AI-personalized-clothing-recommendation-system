<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Wardrobe Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="nav-logo" style="margin-bottom: 20px;">Wardrobe AI</h1>
            <h3 style="margin-bottom: 20px; color: #bfaecf;">Create Account</h3>
            <form id="registerForm">
                <input type="text" id="username" placeholder="Full Name or Username" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" style="width: 100%;">Sign Up</button>
            </form>
            <p id="authFeedback" style="margin-top: 15px; font-size: 0.9rem;"></p>
            <p style="margin-top: 20px; font-size: 0.85rem; color: #a493b8;">
                Already have an account? <a href="login.html" style="color: #ff007f;">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const feedback = document.getElementById('authFeedback');

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();

                if (response.status === 201) {
                    feedback.style.color = '#00ffcc';
                    feedback.textContent = "Account created! Redirecting to login...";
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    feedback.style.color = '#ff007f';
                    feedback.textContent = data.message || "Registration failed.";
                }
            } catch (err) {
                feedback.style.color = '#ff007f';
                feedback.textContent = "Server connection error.";
            }
        });
    </script>
</body>
</html>
